<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Colégio CCM Elias Abrahão</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container">

        <div class="login">

            <h1>Entrar</h1>

            <p class="subtitulo">
                Acesse sua conta do Colégio CCM Elias Abrahão
            </p>


            <form>

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >


                <button type="submit">
                    Entrar
                </button>

            </form>


            <p class="cadastro">
                Ainda não possui uma conta?

                <a href="index.html">
                    Criar cadastro
                </a>
            </p>


            <a href="#" class="esqueci">
                Esqueci minha senha
            </a>
           
            

        </div>

    </div>

</body>
</html>
