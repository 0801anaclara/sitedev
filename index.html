<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Colégio Elias Abrahão</title>

    <link rel="stylesheet" href="sitestyle.css">
</head>

<body>

    <div class="container">

        <div class="cadastro">

            <h1>Cadastro</h1>

            <p class="subtitulo">
                Crie sua conta no Colégio CCM Elias Abrahão 
            </p>

            <form>

                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >
                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <label for="confirmar">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmar"
                    placeholder="Confirme sua senha"
                    required
                >

                <button type="submit">
                    Criar cadastro
                </button>

            </form>

            
            <p class="login">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>
            
        </div>

    </div>

</body>
</html>
